name: Build and Release

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rojo via Rokit
        run: |
          curl -sSf https://raw.githubusercontent.com/rojo-rbx/rokit/main/scripts/install.sh | bash
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.rokit/bin:$PATH"
          rokit trust rojo-rbx/rojo
          rokit add --global rojo-rbx/rojo
          rojo --version

      - name: Build ExtroDevModuleLoader.rbxlx
        run: rojo build -o ExtroDevModuleLoader.rbxlx

      - name: Determine next version tag
        id: version
        run: |
          latest_tag=$(git tag --list 'version-*.*.*' | sed 's/version-//' | sort -t. -k1,1n -k2,2n -k3,3n | tail -n 1)
          if [ -z "$latest_tag" ]; then
            new_tag="1.0.0"
          else
            major=$(echo "$latest_tag" | cut -d. -f1)
            minor=$(echo "$latest_tag" | cut -d. -f2)
            patch=$(echo "$latest_tag" | cut -d. -f3)
            new_tag="$major.$minor.$((patch + 1))"
          fi
          echo "tag=version-$new_tag" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: ExtroDevModuleLoader.rbxlx
